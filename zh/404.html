<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>页面未找到 — BobNote</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      color-scheme: light;
      accent-color: var(--accent);

      --paper: #ffffff;
      --surface: #ffffff;
      --surface-2: #f5f5f7;
      --ink: #1d1d1f;
      --taupe: #636366;
      --accent: #0071e3;
      --accent-text: #0066cc;
      --hairline: #d2d2d7;
      --hairline-strong: #86868b;

      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
      --serif: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;

      --shell: 1120px;
      --gutter: clamp(20px, 5vw, 40px);

      --ease-out: cubic-bezier(0.32, 0.72, 0, 1);
      --dur-fast: 180ms;
    }

    @media (prefers-contrast: more) {
      :root {
        --taupe: #3a3a3c;
        --hairline: #8e8e93;
      }
    }

    * { box-sizing: border-box; }

    html { background: var(--paper); }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 1.0625rem;
      font-synthesis: none;
      font-optical-sizing: auto;
      letter-spacing: -0.022em;
      line-height: 1.47;
      -webkit-font-smoothing: antialiased;
    }

    h1, p { margin-top: 0; }

    a {
      color: var(--accent-text);
      text-underline-offset: .22em;
    }

    a:hover { color: var(--ink); }

    a:focus-visible {
      outline: 2px solid var(--accent-text);
      outline-offset: 4px;
      border-radius: 4px;
    }

    .brand,
    .skip-link,
    .site-nav a,
    .footer-nav a {
      transition: opacity var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
    }

    .site-nav a,
    .footer-nav a {
      transition: opacity var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
    }

    .brand:active,
    .skip-link:active,
    .site-nav a:active,
    .footer-nav a:active {
      opacity: .62;
    }

    .shell {
      width: 100%;
      max-width: var(--shell);
      margin-inline: auto;
      padding-inline: var(--gutter);
    }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      padding: .7rem 1rem;
      background: var(--surface);
      border: 1px solid var(--hairline-strong);
      border-radius: 0 0 8px 0;
      font-size: .875rem;
      font-weight: 600;
      text-decoration: none;
      z-index: 10;
    }

    .skip-link:focus { left: 0; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--hairline);
      background: var(--paper);
    }

    @supports ((backdrop-filter: saturate(180%) blur(20px)) or (-webkit-backdrop-filter: saturate(180%) blur(20px))) {
      @supports (background: color-mix(in srgb, red 50%, transparent)) {
        .site-header {
          background: color-mix(in srgb, var(--paper) 88%, transparent);
          -webkit-backdrop-filter: saturate(180%) blur(20px);
          backdrop-filter: saturate(180%) blur(20px);
        }
      }
    }

    .header-inner {
      flex-wrap: wrap;
      padding-block: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      min-height: 76px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: .7rem;
      color: var(--ink);
      text-decoration: none;
    }

    .brand-word {
      font-size: 1.0625rem;
      font-weight: 600;
      letter-spacing: -0.022em;
    }

    .site-nav {
      display: flex;
      align-items: center;
      gap: 1.75rem;
    }

    .site-nav a {
      color: var(--taupe);
      font-size: .9375rem;
      font-weight: 400;
      text-decoration: none;
      padding-block: .35rem;
      border-bottom: 1px solid transparent;
    }

    .site-nav a:hover,
    .site-nav a[aria-current="page"] {
      color: var(--ink);
      border-bottom-color: var(--accent);
    }

    .eyebrow {
      margin-bottom: 1.1rem;
      color: var(--accent-text);
      font-size: .8125rem;
      font-weight: 600;
      letter-spacing: -0.022em;
      text-transform: none;
    }

    h1 {
      margin: 0 0 1.6rem;
      font-family: var(--serif);
      font-size: clamp(1.95rem, 3.4vw, 2.7rem);
      font-weight: 600;
      letter-spacing: -0.004em;
      line-height: 1.08;
    }

    .site-footer {
      background: var(--surface-2);
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      padding-block: 2rem 2.25rem;
    }

    .footer-mark {
      margin: 0;
      color: var(--taupe);
      font-size: .8125rem;
    }

    .footer-nav {
      display: flex;
      gap: 1.5rem;
    }

    .footer-nav a {
      color: var(--taupe);
      font-size: .8125rem;
      font-weight: 400;
      text-decoration: none;
    }

    .footer-nav a:hover { color: var(--ink); }

    .content-page {
      padding-block: clamp(3.5rem, 8vw, 6rem) clamp(4rem, 9vw, 6.5rem);
    }

    .content-page h1 {
      max-width: 18ch;
      margin-bottom: 1.5rem;
      font-size: clamp(2.1rem, 4.4vw, 3.1rem);
    }

    .page-intro {
      max-width: 62ch;
      margin-bottom: 2.5rem;
      color: var(--taupe);
      font-size: 1.125rem;
      line-height: 1.7;
    }

    @media (max-width: 480px) {
      body { font-size: 1rem; }
      .site-nav { gap: 1.1rem; }
      .footer-inner { flex-direction: column; align-items: flex-start; gap: .85rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="/zh/404.html#main">跳转到正文</a>

  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="/zh/" aria-label="BobNote 首页">
        <span class="brand-word">BobNote</span>
      </a>
      <nav class="site-nav" aria-label="主导航">
        <a href="/zh/">首页</a>
        <a href="/zh/use-cases.html">使用案例</a>
        <a href="/zh/support.html">支持</a>
        <a href="/zh/privacy.html">隐私</a>
      </nav><nav class="language-switch" aria-label="语言"><a href="/404.html" lang="en" hreflang="en">EN</a><span aria-hidden="true">/</span><a href="/zh/404.html" lang="zh-Hans" hreflang="zh-Hans" aria-current="true">中文</a></nav>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div class="shell content-page">
      <p class="eyebrow">404</p>
      <h1>没有找到这个页面。</h1>
      <p class="page-intro">你要访问的页面不在这里。</p>
      <nav class="footer-nav" aria-label="页面导航">
        <a href="/zh/">首页</a>
        <a href="/zh/use-cases.html">使用案例</a>
        <a href="/zh/support.html">支持</a>
        <a href="/zh/privacy.html">隐私</a>
      </nav>
    </div>
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <p class="footer-mark">© 2026 Li Donghai · BobNote™</p>
      <nav class="footer-nav" aria-label="页脚导航">
        <a href="/zh/">首页</a>
        <a href="/zh/use-cases.html">使用案例</a>
        <a href="/zh/support.html">支持</a>
        <a href="/zh/privacy.html">隐私</a>
      </nav>
    </div>
  </footer>
</body>
</html>
